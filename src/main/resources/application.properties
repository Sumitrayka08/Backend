spring.application.name=agrinexus-backend
server.port=${PORT:8080}

# Datasource configuration with comprehensive environment-variable fallback cascade
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:${DATABASE_URL:jdbc:mysql://mysql-12e5f68b-anurag-069b.f.aivencloud.com:15247/agrinexus_db?sslMode=REQUIRED&allowPublicKeyRetrieval=true}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${DB_USER:avnadmin}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${DB_PASS:}}}

# HikariCP connection pool settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Security & AI Service
jwt.secret=${JWT_SECRET}
logging.level.org.springframework.security=INFO
ai.service.url=${AI_SERVICE_URL:https://agrinexus-ai-service.onrender.com}