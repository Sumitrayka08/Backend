spring.application.name=agrinexus-backend
server.port=${PORT:8080}

# Datasource configuration - mapped directly to exact Render environment variables
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/defaultdb}}}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}

# HikariCP connection pool settings
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Security & AI Service
jwt.secret=${JWT_SECRET}
logging.level.org.springframework.security=INFO
ai.service.url=${AI_SERVICE_URL:https://agrinexus-ai-service.onrender.com}